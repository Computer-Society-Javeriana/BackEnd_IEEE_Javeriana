<!-- <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo de Relaciones High-End: Personas - Proyectos</title>
    <!-- Vis.js Network -->
<script type="text/javascript">
    const dataset = {
        nodes: [
            { id: 'u1', label: 'Migao Mendoza', type: 'persona', info: 'Presidente RAS', email: 'migao@javeriana.edu.co' },
            { id: 'u2', label: 'Empanada Pérez', type: 'persona', info: 'Vicepresidente RAS', email: 'empanada@javeriana.edu.co' },
            { id: 'u3', label: 'Tamal García', type: 'persona', info: 'Secretario RAS', email: 'tamal@javeriana.edu.co' },
            { id: 'u4', label: 'Arepa López', type: 'persona', info: 'Webmaster RAS', email: 'arepa@javeriana.edu.co' },
            { id: 'u5', label: 'Ajiaco Ramírez', type: 'persona', info: 'Tesorero RAS', email: 'ajiaco@javeriana.edu.co' },

            { id: 'p1', label: 'Robot Sumo Autónomo', type: 'proyecto', info: 'Estado: Completado', tech: 'C++, ROS2, PCB' },
            { id: 'p2', label: 'Brazo Háptico 6-DOF', type: 'proyecto', info: 'Estado: En Desarrollo', tech: 'Python, Arduino' },
            { id: 'p3', label: 'Visión Drones YOLOv8', type: 'proyecto', info: 'Estado: Fase Inicial', tech: 'PyTorch, OpenCV' },
            { id: 'p4', label: 'Simulador ROS2 Gazebo', type: 'proyecto', info: 'Estado: Completado', tech: 'Gazebo, Linux' }
        ],
        edges: [
            { from: 'u1', to: 'p1' },
            { from: 'u2', to: 'p1' },
            { from: 'u1', to: 'p2' },
            { from: 'u3', to: 'p2' },
            { from: 'u4', to: 'p3' },
            { from: 'u5', to: 'p3' },
            { from: 'u2', to: 'p4' },
            { from: 'u4', to: 'p4' }
        ]
    };

    // Autocompletado del buscador
    const dataList = document.getElementById('nodes-list');
    dataset.nodes.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n.label;
        dataList.appendChild(opt);
    });

    const formattedNodes = dataset.nodes.map(node => {
        const isPersona = node.type === 'persona';
        return {
            id: node.id,
            label: node.label,
            shape: isPersona ? 'dot' : 'diamond',
            size: isPersona ? 20 : 24,
            color: {
                background: isPersona ? '#0284c7' : '#059669',
                border: isPersona ? '#38bdf8' : '#34d399',
                highlight: {
                    background: isPersona ? '#38bdf8' : '#34d399',
                    border: isPersona ? '#bae6fd' : '#a7f3d0'
                },
                hover: {
                    background: isPersona ? '#38bdf8' : '#34d399',
                    border: '#ffffff'
                }
            },
            shadow: {
                enabled: true,
                color: isPersona ? 'rgba(56, 189, 248, 0.45)' : 'rgba(52, 211, 153, 0.45)',
                size: 18,
                x: 0,
                y: 0
            },
            borderWidth: 2,
            borderWidthSelected: 4,
            font: {
                color: '#f8fafc',
                face: 'Inter, system-ui, sans-serif',
                size: 13,
                strokeWidth: 0,
                background: 'rgba(15, 23, 42, 0.75)'
            },
            meta: node,
            hidden: false
        };
    });

    const formattedEdges = dataset.edges.map((edge, index) => ({
        id: `e${index}`,
        from: edge.from,
        to: edge.to,
        color: {
            color: 'rgba(148, 163, 184, 0.25)',
            highlight: '#f43f5e',
            hover: '#fb7185'
        },
        width: 1.5,
        selectionWidth: 3.5,
        hoverWidth: 2.5,
        smooth: { type: 'continuous', roundness: 0.2 }
    }));

    const nodesDataSet = new vis.DataSet(formattedNodes);
    const edgesDataSet = new vis.DataSet(formattedEdges);
    const container = document.getElementById('mynetwork');

    // CONFIGURACIÓN CLAVE: Físicas calculadas al inicio y apagadas por completo
    const options = {
        interaction: {
            hover: true,
            tooltipDelay: 100,
            zoomView: true,
            dragView: true,
            selectConnectedEdges: false
        },
        physics: {
            enabled: false // Totalmente desactivado en tiempo real
        }
    };

    // Crear red y forzar organización instantánea al cargar
    const network = new vis.Network(container, { nodes: nodesDataSet, edges: edgesDataSet }, options);

    // Aplicar diseño de distribución una sola vez al cargar sin animaciones continuas
    network.setOptions({
        physics: {
            enabled: true,
            solver: 'forceAtlas2Based',
            stabilization: {
                enabled: true,
                iterations: 500 // Precalcula la posición ideal antes de renderizar
            }
        }
    });

    // Una vez precalculado, congelar definitivamente la simulación
    network.once("stabilizationIterationsDone", function () {
        network.setOptions({ physics: { enabled: false } });
    });

    // Tooltip flotante
    const tooltipEl = document.getElementById('custom-tooltip');
    let currentMouseX = 0;
    let currentMouseY = 0;

    document.addEventListener('mousemove', (e) => {
        currentMouseX = e.clientX;
        currentMouseY = e.clientY;
        if (tooltipEl.classList.contains('visible')) {
            tooltipEl.style.left = `${currentMouseX}px`;
            tooltipEl.style.top = `${currentMouseY}px`;
        }
    });

    network.on("hoverNode", function (params) {
        const node = nodesDataSet.get(params.node);
        if (node && node.meta) {
            document.getElementById('tt-tag').textContent = node.meta.type;
            document.getElementById('tt-tag').className = `tooltip-tag tag-${node.meta.type}`;
            document.getElementById('tt-title').textContent = node.meta.label;
            document.getElementById('tt-info').textContent = node.meta.info;
            document.getElementById('tt-extra').textContent = node.meta.email || node.meta.tech || '';

            tooltipEl.style.left = `${currentMouseX}px`;
            tooltipEl.style.top = `${currentMouseY}px`;
            tooltipEl.className = `visible ${node.meta.type}-border`;
        }
    });

    network.on("blurNode", function () {
        tooltipEl.className = '';
    });

    // Click en nodos para resaltar
    network.on("click", function (params) {
        if (params.nodes.length > 0) {
            const selectedNodeId = params.nodes[0];
            const connectedNodes = network.getConnectedNodes(selectedNodeId);
            const connectedEdges = network.getConnectedEdges(selectedNodeId);

            nodesDataSet.update(nodesDataSet.get().map(node => {
                const isConnected = node.id === selectedNodeId || connectedNodes.includes(node.id);
                return {
                    id: node.id,
                    opacity: isConnected ? 1 : 0.12,
                    font: { color: isConnected ? '#ffffff' : 'rgba(255, 255, 255, 0.2)' }
                };
            }));

            edgesDataSet.update(edgesDataSet.get().map(edge => {
                const isConnected = connectedEdges.includes(edge.id);
                return {
                    id: edge.id,
                    width: isConnected ? 3 : 1,
                    color: { color: isConnected ? '#f43f5e' : 'rgba(148, 163, 184, 0.05)' }
                };
            }));
        } else {
            nodesDataSet.update(nodesDataSet.get().map(node => ({
                id: node.id,
                opacity: 1,
                font: { color: '#f8fafc' }
            })));
            edgesDataSet.update(edgesDataSet.get().map(edge => ({
                id: edge.id,
                width: 1.5,
                color: { color: 'rgba(148, 163, 184, 0.25)' }
            })));
        }
    });

    // Botones Zoom / Fit
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
        network.moveTo({ scale: network.getScale() * 1.25, animation: { duration: 300 } });
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
        network.moveTo({ scale: network.getScale() * 0.8, animation: { duration: 300 } });
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
        network.fit({ animation: { duration: 500 } });
    });

    // Toggle por categorías
    const stateVisibility = { persona: true, proyecto: true };

    function toggleType(type, elementId) {
        stateVisibility[type] = !stateVisibility[type];
        document.getElementById(elementId).classList.toggle('disabled', !stateVisibility[type]);

        const nodesToUpdate = nodesDataSet.get().map(n => {
            if (n.meta.type === type) {
                return { id: n.id, hidden: !stateVisibility[type] };
            }
            return null;
        }).filter(Boolean);

        nodesDataSet.update(nodesToUpdate);
    }

    document.getElementById('toggle-persona').addEventListener('click', () => toggleType('persona', 'toggle-persona'));
    document.getElementById('toggle-proyecto').addEventListener('click', () => toggleType('proyecto', 'toggle-proyecto'));

    // Buscador
    document.getElementById('node-search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) return;

        const foundNode = nodesDataSet.get().find(n => n.label.toLowerCase().includes(query));
        if (foundNode) {
            network.selectNodes([foundNode.id]);
            network.focus(foundNode.id, { scale: 1.2, animation: { duration: 600 } });
        }
    });
</script>
</body>

</html>
